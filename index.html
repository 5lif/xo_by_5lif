<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة X و O - 5lif</title>
    <style>
        :root {
            --bg-color: #121214;
            --container-bg: #1a1a1e;
            --cell-bg: #26262b;
            --cell-hover: #323239;
            --text-color: #ffffff;
            --x-color: #ff4a4a;
            --o-color: #4a90ff;
            --accent-color: #00db80;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { margin-bottom: 20px; font-size: 2rem; }
        .controls { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #aaa; }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background-color: var(--cell-bg);
            color: var(--text-color);
            border: 1px solid #444;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
        }
        .status { margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; height: 30px; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
        .cell {
            aspect-ratio: 1;
            background-color: var(--cell-bg);
            border: none;
            border-radius: 12px;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cell:hover { background-color: var(--cell-hover); }
        .cell:active { transform: scale(0.95); }
        .cell.x { color: var(--x-color); }
        .cell.o { color: var(--o-color); }
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }
        .btn:hover { opacity: 0.9; }
        footer { margin-top: 30px; font-size: 0.9rem; color: #666; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>لعبة X و O</h1>
        <div class="controls">
            <label for="difficulty">مستوى صعوبة الكمبيوتر:</label>
            <select id="difficulty">
                <option value="easy">سهل</option>
                <option value="medium">متوسط</option>
                <option value="hard">صعب</option>
            </select>
        </div>
        <div class="status" id="status">دورك الآن (X)</div>
        <div class="board" id="board">
            <button class="cell" id="boxZero"></button>
            <button class="cell" id="boxOne"></button>
            <button class="cell" id="boxTwo"></button>
            <button class="cell" id="boxThree"></button>
            <button class="cell" id="boxFour"></button>
            <button class="cell" id="boxFive"></button>
            <button class="cell" id="boxSix"></button>
            <button class="cell" id="boxSeven"></button>
            <button class="cell" id="boxEight"></button>
        </div>
        <button class="btn" id="resetBtn">إعادة اللعب</button>
    </div>

    <footer>by: 5lif</footer>

    <script>
        const c0 = document.getElementById('boxZero');
        const c1 = document.getElementById('boxOne');
        const c2 = document.getElementById('boxTwo');
        const c3 = document.getElementById('boxThree');
        const c4 = document.getElementById('boxFour');
        const c5 = document.getElementById('boxFive');
        const c6 = document.getElementById('boxSix');
        const c7 = document.getElementById('boxSeven');
        const c8 = document.getElementById('boxEight');

        const cellElements = [c0, c1, c2, c3, c4, c5, c6, c7, c8];
        const statusText = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');
        const difficultySelect = document.getElementById('difficulty');

        let isGameActive = true;
        const playerSign = "X";
        const computerSign = "O";

        cellElements.forEach((cell, idx) => {
            cell.addEventListener('click', () => handleCellClick(idx));
        });

        resetBtn.addEventListener('click', resetGame);
        difficultySelect.addEventListener('change', resetGame);

        // نظام فحص ذكي ومحمي يعتمد على الحروف المنفصلة لمنع الحذف التلقائي نهائياً
        function checkWin(sign) {
            const txt0 = c0.innerText; const txt1 = c1.innerText; const txt2 = c2.innerText;
            const txt3 = c3.innerText; const txt4 = c4.innerText; const txt5 = c5.innerText;
            const txt6 = c6.innerText; const txt7 = c7.innerText; const txt8 = c8.innerText;

            if (txt0 === sign && txt1 === sign && txt2 === sign) return true;
            if (txt3 === sign && txt4 === sign && txt5 === sign) return true;
            if (txt6 === sign && txt7 === sign && txt8 === sign) return true;
            if (txt0 === sign && txt3 === sign && txt6 === sign) return true;
            if (txt1 === sign && txt4 === sign && txt7 === sign) return true;
            if (txt2 === sign && txt5 === sign && txt8 === sign) return true;
            if (txt0 === sign && txt4 === sign && txt8 === sign) return true;
            if (txt2 === sign && txt4 === sign && txt6 === sign) return true;
            return false;
        }

        function handleCellClick(index) {
            if (cellElements[index].innerText !== "" || !isGameActive) return;

            makeMove(index, playerSign);
            if (checkWin(playerSign)) { endGame("مبروك! لقد فزت على الكمبيوتر! 🎉"); return; }
            if (cellElements.every(c => c.innerText !== "")) { endGame("تعادل! 🤝"); return; }

            isGameActive = false;
            statusText.innerText = "جاري تفكير الكمبيوتر...";
            
            setTimeout(() => {
                const level = difficultySelect.value;
                let move = null;

                if (level === "easy") {
                    move = getRandomMove();
                } else if (level === "medium") {
                    move = getMediumMove() || getRandomMove();
                } else {
                    move = getBestMove() || getRandomMove();
                }

                if (move !== null && move !== undefined) {
                    makeMove(move, computerSign);
                    if (checkWin(computerSign)) { endGame("خسرت! الكمبيوتر فاز هذه المرة. 💥"); return; }
                    if (cellElements.every(c => c.innerText !== "")) { endGame("تعادل! 🤝"); return; }
                }
                isGameActive = true;
                statusText.innerText = "دورك الآن (X)";
            }, 400);
        }

        function makeMove(index, sign) {
            cellElements[index].innerText = sign;
            cellElements[index].classList.add(sign.toLowerCase());
        }

        function endGame(message) { statusText.innerText = message; isGameActive = false; }
        
        function getRandomMove() {
            const avail = [];
            cellElements.forEach((c, i) => { if (c.innerText === "") avail.push(i); });
            return avail.length > 0 ? avail[Math.floor(Math.random() * avail.length)] : null;
        }

        function getMediumMove() {
            // محاكاة الفوز أو الصد للكمبيوتر
            for (let i = 0; i < 9; i++) {
                if (cellElements[i].innerText === "") {
                    cellElements[i].innerText = computerSign;
                    if (checkWin(computerSign)) { cellElements[i].innerText = ""; return i; }
                    cellElements[i].innerText = "";
                }
            }
            for (let i = 0; i < 9; i++) {
                if (cellElements[i].innerText === "") {
                    cellElements[i].innerText = playerSign;
                    if (checkWin(playerSign)) { cellElements[i].innerText = ""; return i; }
                    cellElements[i].innerText = "";
                }
            }
            return null;
        }

        function getBestMove() {
            let bestScore = -Infinity;
            let move = null;
            
            for (let i = 0; i < 9; i++) {
                if (cellElements[i].innerText === "") {
                    cellElements[i].innerText = computerSign;
                    let score = minimax(0, false);
                    cellElements[i].innerText = "";
                    if (score > bestScore) { bestScore = score; move = i; }
                }
            }
            return move;
        }

        function minimax(depth, isMax) {
            if (checkWin(computerSign)) return 10 - depth;
            if (checkWin(playerSign)) return depth - 10;
            if (cellElements.every(c => c.innerText !== "")) return 0;

            if (isMax) {
                let best = -Infinity;
                for (let i = 0; i < 9; i++) {
