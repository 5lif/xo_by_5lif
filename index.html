<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة X و O الرسمية</title>
    <style>
        :root {
            --bg-color: #0da192; /* اللون الأخضر الرسمي الشهير للعبة */
            --text-color: #ffffff;
            --line-color: #0b8c7f; /* لون الخطوط المتقاطعة الأصلية */
            --x-color: #545454;    /* لون X الرسمي الداكن */
            --o-color: #f2ebd3;    /* لون O الرسمي الفاتح */
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .controls {
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        label {
            font-size: 1.1rem;
            font-weight: bold;
        }
        select {
            padding: 6px 12px;
            border-radius: 5px;
            background-color: #0b8c7f;
            color: var(--text-color);
            border: none;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
            font-weight: bold;
        }
        .status {
            margin-bottom: 20px;
            font-size: 1.4rem;
            font-weight: bold;
            height: 35px;
        }
        /* تصميم الرقعة المفتوحة الرسمية للعبة الشهيرة */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 300px;
            height: 300px;
            margin: 0 auto 30px auto;
        }
        .cell {
            border: none;
            background: transparent;
            font-size: 4.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: background-color 0.2s;
        }
        /* صناعة الخطوط المتقاطعة بدون حدود خارجية كالمواقع الرسمية */
        .cell:nth-child(1), .cell:nth-child(2), .cell:nth-child(3),
        .cell:nth-child(4), .cell:nth-child(5), .cell:nth-child(6) {
            border-bottom: 6px solid var(--line-color);
        }
        .cell:nth-child(1), .cell:nth-child(4), .cell:nth-child(7),
        .cell:nth-child(2), .cell:nth-child(5), .cell:nth-child(8) {
            border-left: 6px solid var(--line-color);
        }
        .cell.x { color: var(--x-color); }
        .cell.o { color: var(--o-color); }
        
        .btn {
            background-color: #0b8c7f;
            color: var(--text-color);
            border: none;
            padding: 10px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px rgba(0,0,0,0.15);
            transition: all 0.1s;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px rgba(0,0,0,0.15);
        }
        footer {
            margin-top: 40px;
            font-size: 1rem;
            color: rgba(255,255,255,0.6);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>إكس أو</h1>
        
        <div class="controls">
            <label for="difficulty">المستوى:</label>
            <select id="difficulty">
                <option value="easy">سهل</option>
                <option value="medium">متوسط</option>
                <option value="hard">صعب</option>
            </select>
        </div>

        <div class="status" id="status">دورك الآن (X)</div>

        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <button class="btn" id="resetBtn">إعادة اللعب</button>
    </div>

    <footer>by: 5lif</footer>

    <script>
        const board = document.getElementById('board');
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');
        const difficultySelect = document.getElementById('difficulty');

        let gameState = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;
        const playerSign = "X";
        const computerSign = "O";

        const winPatterns = [, [3, 4, 5], [6, 7, 8],
, [1, 4, 7], [2, 5, 8],
, [2, 4, 6]
        ];

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        resetBtn.addEventListener('click', resetGame);
        difficultySelect.addEventListener('change', resetGame);

        function handleCellClick(e) {
            const clickedCell = e.target;
            const index = parseInt(clickedCell.getAttribute('data-index'));
            if (gameState[index] !== "" || !isGameActive) return;

            makeMove(index, playerSign);
            if (checkWin(gameState, playerSign)) { endGame("كفو! فزت على الكمبيوتر 🎉"); return; }
            if (gameState.every(cell => cell !== "")) { endGame("النتيجة: تعادل! 🤝"); return; }

            isGameActive = false;
            statusText.innerText = "جاري تفكير الكمبيوتر...";
            
            setTimeout(() => {
                const level = difficultySelect.value;
                let move;
                if (level === "easy") move = getRandomMove();
                else if (level === "medium") move = getMediumMove();
                else move = getBestMove();

                if (move !== null && move !== undefined) {
                    makeMove(move, computerSign);
                    if (checkWin(gameState, computerSign)) { endGame("الكمبيوتر فاز! حاول مرة أخرى 💥"); return; }
                    if (gameState.every(cell => cell !== "")) { endGame("النتيجة: تعادل! 🤝"); return; }
                }
                isGameActive = true;
                statusText.innerText = "دورك الآن (X)";
            }, 400);
        }

        function makeMove(index, sign) {
            gameState[index] = sign;
            cells[index].innerText = sign;
            cells[index].classList.add(sign.toLowerCase());
        }

        function checkWin(boardState, sign) {
            return winPatterns.some(pattern => pattern.every(index => boardState[index] === sign));
        }

        function endGame(message) { statusText.innerText = message; isGameActive = false; }
        
        function getRandomMove() {
            const availMoves = gameState.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);
            return availMoves[Math.floor(Math.random() * availMoves.length)];
        }

        function getMediumMove() {
            for (let i = 0; i < gameState.length; i++) {
                if (gameState[i] === "") {
                    let tempBoard = [...gameState]; tempBoard[i] = computerSign;
                    if (checkWin(tempBoard, computerSign)) return i;
                }
            }
            for (let i = 0; i < gameState.length; i++) {
                if (gameState[i] === "") {
                    let tempBoard = [...gameState]; tempBoard[i] = playerSign;
                    if (checkWin(tempBoard, playerSign)) return i;
                }
            }
            return getRandomMove();
        }

        function getBestMove() {
            let bestScore = -Infinity; let move;
            for (let i = 0; i < 9; i++) {
                if (gameState[i] === "") {
                    gameState[i] = computerSign;
                    let score = evaluateBoard(gameState, 0, false);
                    gameState[i] = "";
                    if (score > bestScore) { bestScore = score; move = i; }
                }
            }
            return move;
        }

        function evaluateBoard(boardState, depth, isMaximizing) {
            if (checkWin(boardState, computerSign)) return 10 - depth;
            if (checkWin(boardState, playerSign)) return depth - 10;
            if (boardState.every(cell => cell !== "")) return 0;

            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (boardState[i] === "") {
                        boardState[i] = computerSign;
                        let score = evaluateBoard(boardState, depth + 1, false);
                        boardState[i] = ""; bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (boardState[i] === "") {
                        boardState[i] = playerSign;
