<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة X و O - 5lif</title>
    <style>
        :root {
            --bg-color: #121214;
            --container-bg: #1a1a1e;
            --cell-bg: #26262b;
            --cell-hover: #323239;
            --text-color: #ffffff;
            --x-color: #ff4a4a;
            --o-color: #4a90ff;
            --accent-color: #00db80;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { margin-bottom: 20px; font-size: 2rem; }
        .controls { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #aaa; }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background-color: var(--cell-bg);
            color: var(--text-color);
            border: 1px solid #444;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
        }
        .status { margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; height: 30px; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
        .cell {
            aspect-ratio: 1;
            background-color: var(--cell-bg);
            border: none;
            border-radius: 12px;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cell:hover { background-color: var(--cell-hover); }
        .cell:active { transform: scale(0.95); }
        .cell.x { color: var(--x-color); }
        .cell.o { color: var(--o-color); }
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }
        .btn:hover { opacity: 0.9; }
        footer { margin-top: 30px; font-size: 0.9rem; color: #666; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>لعبة X و O</h1>
        <div class="controls">
            <label for="difficulty">مستوى صعوبة الكمبيوتر:</label>
            <select id="difficulty">
                <option value="easy">سهل</option>
                <option value="medium">متوسط</option>
                <option value="hard">صعب</option>
            </select>
        </div>
        <div class="status" id="status">دورك الآن (X)</div>
        <div class="board" id="board">
            <button class="cell" id="c0"></button>
            <button class="cell" id="c1"></button>
            <button class="cell" id="c2"></button>
            <button class="cell" id="c3"></button>
            <button class="cell" id="c4"></button>
            <button class="cell" id="c5"></button>
            <button class="cell" id="c6"></button>
            <button class="cell" id="c7"></button>
            <button class="cell" id="c8"></button>
        </div>
        <button class="btn" id="resetBtn">إعادة اللعب</button>
    </div>

    <footer>by: 5lif</footer>

    <script>
        const cells = [
            document.getElementById('c0'), document.getElementById('c1'), document.getElementById('c2'),
            document.getElementById('c3'), document.getElementById('c4'), document.getElementById('c5'),
            document.getElementById('c6'), document.getElementById('c7'), document.getElementById('c8')
        ];
        const statusText = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');
        const difficultySelect = document.getElementById('difficulty');

        let isGameActive = true;
        const playerSign = "X";
        const computerSign = "O";

        cells.forEach((cell, idx) => cell.addEventListener('click', () => handleCellClick(idx)));
        resetBtn.addEventListener('click', resetGame);
        difficultySelect.addEventListener('change', resetGame);

        function checkWin(sign) {
            const v = cells.map(c => c.innerText);
            const patterns = [, [3, 4, 5], [6, 7, 8],
, [1, 4, 7], [2, 5, 8],
, [2, 4, 6]
            ];
            return patterns.some(p => p.every(idx => v[idx] === sign));
        }

        function handleCellClick(index) {
            if (cells[index].innerText !== "" || !isGameActive) return;

            makeMove(index, playerSign);
            if (checkWin(playerSign)) { endGame("مبروك! لقد فزت على الكمبيوتر! 🎉"); return; }
            if (cells.every(c => c.innerText !== "")) { endGame("تعادل! 🤝"); return; }

            isGameActive = false;
            statusText.innerText = "جاري تفكير الكمبيوتر...";
            
            setTimeout(() => {
                const level = difficultySelect.value;
                let move = null;

                if (level === "easy") {
                    move = getRandomMove();
                } else if (level === "medium") {
                    move = getMediumMove() ?? getRandomMove();
                } else {
                    move = getBestMove() ?? getRandomMove();
                }

                if (move !== null) {
                    makeMove(move, computerSign);
                    if (checkWin(computerSign)) { endGame("خسرت! الكمبيوتر فاز هذه المرة. 💥"); return; }
                    if (cells.every(c => c.innerText !== "")) { endGame("تعادل! 🤝"); return; }
                }
                isGameActive = true;
                statusText.innerText = "دورك الآن (X)";
            }, 500);
        }

        function makeMove(index, sign) {
            cells[index].innerText = sign;
            cells[index].classList.add(sign.toLowerCase());
        }

        function endGame(message) { statusText.innerText = message; isGameActive = false; }
        
        function getRandomMove() {
            const avail = cells.map((c, i) => c.innerText === "" ? i : null).filter(v => v !== null);
            return avail.length > 0 ? avail[Math.floor(Math.random() * avail.length)] : null;
        }

        function getMediumMove() {
            const v = cells.map(c => c.innerText);
            const patterns = [, [3, 4, 5], [6, 7, 8],
, [1, 4, 7], [2, 5, 8],
, [2, 4, 6]
            ];
            for (let sign of [computerSign, playerSign]) {
                for (let p of patterns) {
                    const match = p.filter(idx => v[idx] === sign);
                    const empty = p.filter(idx => v[idx] === "");
                    if (match.length === 2 && empty.length === 1) return empty[0];
                }
            }
            return null;
        }

        function getBestMove() {
            let bestScore = -Infinity;
            let move = null;
            const v = cells.map(c => c.innerText);
            
            for (let i = 0; i < 9; i++) {
                if (v[i] === "") {
                    v[i] = computerSign;
                    let score = minimax(v, 0, false);
                    v[i] = "";
                    if (score > bestScore) { bestScore = score; move = i; }
                }
            }
            return move;
        }

        function checkWinState(v, sign) {
            const patterns = [, [3, 4, 5], [6, 7, 8],
, [1, 4, 7], [2, 5, 8],
, [2, 4, 6]
            ];
            return patterns.some(p => p.every(idx => v[idx] === sign));
        }

        function minimax(v, depth, isMax) {
            if (checkWinState(v, computerSign)) return 10 - depth;
            if (checkWinState(v, playerSign)) return depth - 10;
            if (v.every(x => x !== "")) return 0;

            if (isMax) {
                let best = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (v[i] === "") {
                        v[i] = computerSign;
                        best = Math.max(best, minimax(v, depth + 1, false));
                        v[i] = "";
                    }
                }
                return best;
            } else {
                let best = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (v[i] === "") {
                        v[i] = playerSign;
                        best = Math.min(best, minimax(v, depth + 1, true));
                        v[i] = "";
                    }
                }
                return best;
            }
        }

        function resetGame() {
            isGameActive = true;
            statusText.innerText = "دورك الآن (X)";
            cells.forEach(cell => { cell.innerText = ""; cell.className = "cell"; });
        }
    </script>
</body>
</html>
