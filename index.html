<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة X و O - 5lif</title>
    <style>
        :root {
            --bg-color: #121214;
            --container-bg: #1a1a1e;
            --cell-bg: #26262b;
            --cell-hover: #323239;
            --text-color: #ffffff;
            --x-color: #ff4a4a;
            --o-color: #4a90ff;
            --accent-color: #00db80;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { margin-bottom: 20px; font-size: 2rem; }
        .controls { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #aaa; }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background-color: var(--cell-bg);
            color: var(--text-color);
            border: 1px solid #444;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
        }
        .status { margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; height: 30px; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
        .cell {
            aspect-ratio: 1;
            background-color: var(--cell-bg);
            border: none;
            border-radius: 12px;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cell:hover { background-color: var(--cell-hover); }
        .cell:active { transform: scale(0.95); }
        .cell.x { color: var(--x-color); }
        .cell.o { color: var(--o-color); }
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }
        .btn:hover { opacity: 0.9; }
        footer { margin-top: 30px; font-size: 0.9rem; color: #666; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>لعبة X و O</h1>
        <div class="controls">
            <label for="difficulty">مستوى صعوبة الكمبيوتر:</label>
            <select id="difficulty">
                <option value="easy">سهل</option>
                <option value="medium">متوسط</option>
                <option value="hard">صعب</option>
            </select>
        </div>
        <div class="status" id="status">دورك الآن (X)</div>
        <div class="board" id="board">
            <button class="cell" id="b0" onclick="cellPressed(0)"></button>
            <button class="cell" id="b1" onclick="cellPressed(1)"></button>
            <button class="cell" id="b2" onclick="cellPressed(2)"></button>
            <button class="cell" id="b3" onclick="cellPressed(3)"></button>
            <button class="cell" id="b4" onclick="cellPressed(4)"></button>
            <button class="cell" id="b5" onclick="cellPressed(5)"></button>
            <button class="cell" id="b6" onclick="cellPressed(6)"></button>
            <button class="cell" id="b7" onclick="cellPressed(7)"></button>
            <button class="cell" id="b8" onclick="cellPressed(8)"></button>
        </div>
        <button class="btn" onclick="restartMatch()">إعادة اللعب</button>
    </div>

    <footer>by: 5lif</footer>

    <script>
        const statusText = document.getElementById('status');
        const difficultySelect = document.getElementById('difficulty');
        
        let playActive = true;

        function getSign(id) {
            return document.getElementById(id).innerText;
        }

        function setSign(id, sign) {
            const el = document.getElementById(id);
            el.innerText = sign;
            el.classList.add(sign.toLowerCase());
        }

        function isFull() {
            for(let i=0; i<9; i++) {
                if(getSign('b' + i) === "") return false;
            }
            return true;
        }

        // دالة فحص فوز كلاسيكية نصوصية كاملة ومقاومة للتعليق والحذف
        function checkWinner(s) {
            if (getSign('b0')===s && getSign('b1')===s && getSign('b2')===s) return true;
            if (getSign('b3')===s && getSign('b4')===s && getSign('b5')===s) return true;
            if (getSign('b6')===s && getSign('b7')===s && getSign('b8')===s) return true;
            if (getSign('b0')===s && getSign('b3')===s && getSign('b6')===s) return true;
            if (getSign('b1')===s && getSign('b4')===s && getSign('b7')===s) return true;
            if (getSign('b2')===s && getSign('b5')===s && getSign('b8')===s) return true;
            if (getSign('b0')===s && getSign('b4')===s && getSign('b8')===s) return true;
            if (getSign('b2')===s && getSign('b4')===s && getSign('b6')===s) return true;
            return false;
        }

        function cellPressed(num) {
            if (!playActive || getSign('b' + num) !== "") return;

            setSign('b' + num, "X");

            if (checkWinner("X")) {
                statusText.innerText = "مبروك! لقد فزت على الكمبيوتر! 🎉";
                playActive = false;
                return;
            }

            if (isFull()) {
                statusText.innerText = "تعادل! 🤝";
                playActive = false;
                return;
            }

            playActive = false;
            statusText.innerText = "جاري تفكير الكمبيوتر...";

            setTimeout(() => {
                botPlay();
            }, 400);
        }

        function botPlay() {
            const level = difficultySelect.value;
            let choice = -1;

            if (level === "medium" || level === "hard") {
                // محاولة فوز البوت أولاً
                choice = findSmartIndex("O");
                // صد اللاعب ثانياً
                if (choice === -1) choice = findSmartIndex("X");
            }

            if (level === "hard" && choice === -1) {
                if (getSign('b4') === "") choice = 4;
            }

            // حركة عشوائية
            if (choice === -1) {
                let emptyCells = [];
                for (let i=0; i<9; i++) {
                    if (getSign('b' + i) === "") emptyCells.push(i);
                }
                if (emptyCells.length > 0) {
                    choice = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                }
            }

            if (choice !== -1) {
                setSign('b' + choice, "O");

                if (checkWinner("O")) {
                    statusText.innerText = "خسرت! الكمبيوتر فاز هذه المرة. 💥";
                    playActive = false;
                    return;
                }

                if (isFull()) {
                    statusText.innerText = "تعادل! 🤝";
                    playActive = false;
                    return;
                }
            }

            playActive = true;
            statusText.innerText = "دورك الآن (X)";
        }

        function findSmartIndex(s) {
            // فحص ذكي مبسط لحركات الصد والفوز
            const combinations = [, [3,4,5], [6,7,8],
, [1,4,7], [2,5,8],
, [2,4,6]
            ];
            for (let i=0; i<combinations.length; i++) {
                const [r, g, b] = combinations[i];
                if (getSign('b'+r)===s && getSign('b'+g)===s && getSign('b'+b)==="") return b;
                if (getSign('b'+r)===s && getSign('b'+b)===s && getSign('b'+g)==="") return g;
                if (getSign('b'+g)===s && getSign('b'+b)===s && getSign('b'+r)==="") return r;
            }
            return -1;
        }

        function restartMatch() {
            playActive = true;
            statusText.innerText = "دورك الآن (X)";
            for (let i=0; i<9; i++) {
                const btn = document.getElementById('b' + i);
                btn.innerText = "";
                btn.className = "cell";
            }
        }
    </script>
</body>
</html>
