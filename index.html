<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة X و O - 5lif</title>
    <style>
        :root {
            --bg-color: #121214;
            --container-bg: #1a1a1e;
            --cell-bg: #26262b;
            --cell-hover: #323239;
            --text-color: #ffffff;
            --x-color: #ff4a4a;
            --o-color: #4a90ff;
            --accent-color: #00db80;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { margin-bottom: 20px; font-size: 2rem; }
        .controls { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #aaa; }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background-color: var(--cell-bg);
            color: var(--text-color);
            border: 1px solid #444;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
        }
        .status { margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; height: 30px; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
        .cell {
            aspect-ratio: 1;
            background-color: var(--cell-bg);
            border: none;
            border-radius: 12px;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cell:hover { background-color: var(--cell-hover); }
        .cell:active { transform: scale(0.95); }
        .cell.x { color: var(--x-color); }
        .cell.o { color: var(--o-color); }
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }
        .btn:hover { opacity: 0.9; }
        footer { margin-top: 30px; font-size: 0.9rem; color: #666; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>لعبة X و O</h1>
        <div class="controls">
            <label for="difficulty">مستوى صعوبة الكمبيوتر:</label>
            <select id="difficulty">
                <option value="easy">سهل</option>
                <option value="medium">متوسط</option>
                <option value="hard">صعب</option>
            </select>
        </div>
        <div class="status" id="status">دورك الآن (X)</div>
        <div class="board" id="board">
            <button class="cell" onclick="playerClick(0)"></button>
            <button class="cell" onclick="playerClick(1)"></button>
            <button class="cell" onclick="playerClick(2)"></button>
            <button class="cell" onclick="playerClick(3)"></button>
            <button class="cell" onclick="playerClick(4)"></button>
            <button class="cell" onclick="playerClick(5)"></button>
            <button class="cell" onclick="playerClick(6)"></button>
            <button class="cell" onclick="playerClick(7)"></button>
            <button class="cell" onclick="playerClick(8)"></button>
        </div>
        <button class="btn" onclick="resetGame()">إعادة اللعب</button>
    </div>

    <footer>by: 5lif</footer>

    <script>
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('status');
        const difficultySelect = document.getElementById('difficulty');

        let boardState = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;

        // مصفوفة التحقق من الفوز الثابتة والمضمونة
        const winConditions = [, [3, 4, 5], [6, 7, 8], // أفقي, [1, 4, 7], [2, 5, 8], // عمودي, [2, 4, 6]             // قطري
        ];

        function playerClick(index) {
            if (boardState[index] !== "" || !isGameActive) return;

            // حركة اللاعب
            makeMove(index, "X");

            if (checkWin("X")) {
                statusText.innerText = "مبروك! لقد فزت على الكمبيوتر! 🎉";
                isGameActive = false;
                return;
            }

            if (!boardState.includes("")) {
                statusText.innerText = "تعادل! 🤝";
                isGameActive = false;
                return;
            }

            // حركة الكمبيوتر بتأخير بسيط
            isGameActive = false;
            statusText.innerText = "جاري تفكير الكمبيوتر...";
            setTimeout(() => {
                computerMove();
            }, 400);
        }

        function computerMove() {
            const level = difficultySelect.value;
            let choice = null;

            if (level === "hard" || level === "medium") {
                // 1. محاولة الفوز للكمبيوتر
                choice = findWinningMove("O");
                // 2. صد اللاعب ومنعه من الفوز
                if (choice === null) choice = findWinningMove("X");
            }

            if (level === "hard" && choice === null) {
                // في المستوى الصعب، السيطرة على المنتصف أو الزوايا أولاً
                if (boardState[4] === "") choice = 4;
                else {
                    const corners =;
                    const emptyCorners = corners.filter(i => boardState[i] === "");
                    if (emptyCorners.length > 0) choice = emptyCorners[Math.floor(Math.random() * emptyCorners.length)];
                }
            }

            // حركة عشوائية إذا لم يجد خياراً ذكياً أو في المستوى السهل
            if (choice === null) {
                const emptyCells = [];
                boardState.forEach((val, idx) => { if (val === "") emptyCells.push(idx); });
                if (emptyCells.length > 0) choice = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }

            if (choice !== null) {
                makeMove(choice, "O");

                if (checkWin("O")) {
                    statusText.innerText = "خسرت! الكمبيوتر فاز هذه المرة. 💥";
                    isGameActive = false;
                    return;
                }

                if (!boardState.includes("")) {
                    statusText.innerText = "تعادل! 🤝";
                    isGameActive = false;
                    return;
                }
            }

            isGameActive = true;
            statusText.innerText = "دورك الآن (X)";
        }

        function makeMove(index, sign) {
            boardState[index] = sign;
            cells[index].innerText = sign;
            cells[index].classList.add(sign.toLowerCase());
        }

        function checkWin(sign) {
            return winConditions.some(condition => {
                return condition.every(index => boardState[index] === sign);
            });
        }

        function findWinningMove(sign) {
            for (let i = 0; i < winConditions.length; i++) {
                const [a, b, c] = winConditions[i];
                if (boardState[a] === sign && boardState[b] === sign && boardState[c] === "") return c;
                if (boardState[a] === sign && boardState[c] === sign && boardState[b] === "") return b;
                if (boardState[b] === sign && boardState[c] === sign && boardState[a] === "") return a;
            }
            return null;
        }

        function resetGame() {
            boardState = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            statusText.innerText = "دورك الآن (X)";
            cells.forEach(cell => {
                cell.innerText = "";
                cell.className = "cell";
            });
        }
    </script>
</body>
</html>
