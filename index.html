<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة X و O - 5lif</title>
    <style>
        :root {
            --bg-color: #121214;
            --container-bg: #1a1a1e;
            --cell-bg: #26262b;
            --cell-hover: #323239;
            --text-color: #ffffff;
            --x-color: #ff4a4a;
            --o-color: #4a90ff;
            --accent-color: #00db80;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { margin-bottom: 20px; font-size: 2rem; }
        .controls { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #aaa; }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background-color: var(--cell-bg);
            color: var(--text-color);
            border: 1px solid #444;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
        }
        .status { margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; height: 30px; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
        .cell {
            aspect-ratio: 1;
            background-color: var(--cell-bg);
            border: none;
            border-radius: 12px;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cell:hover { background-color: var(--cell-hover); }
        .cell:active { transform: scale(0.95); }
        .cell.x { color: var(--x-color); }
        .cell.o { color: var(--o-color); }
        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
        }
        .btn:hover { opacity: 0.9; }
        footer { margin-top: 30px; font-size: 0.9rem; color: #666; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>لعبة X و O</h1>
        <div class="controls">
            <label for="difficulty">مستوى صعوبة الكمبيوتر:</label>
            <select id="difficulty">
                <option value="easy">سهل</option>
                <option value="medium">متوسط</option>
                <option value="hard">صعب</option>
            </select>
        </div>
        <div class="status" id="status">دورك الآن (X)</div>
        <div class="board" id="board">
            <button class="cell" data-num="0"></button>
            <button class="cell" data-num="1"></button>
            <button class="cell" data-num="2"></button>
            <button class="cell" data-num="3"></button>
            <button class="cell" data-num="4"></button>
            <button class="cell" data-num="5"></button>
            <button class="cell" data-num="6"></button>
            <button class="cell" data-num="7"></button>
            <button class="cell" data-num="8"></button>
        </div>
        <button class="btn" id="resetMatchBtn">إعادة اللعب</button>
    </div>

    <footer>by: 5lif</footer>

    <script>
        const statusText = document.getElementById('status');
        const difficultySelect = document.getElementById('difficulty');
        const resetBtn = document.getElementById('resetMatchBtn');
        const cells = document.querySelectorAll('.cell');
        
        let boardState = ["", "", "", "", "", "", "", "", ""];
        let playActive = true;

        // تفعيل المستمعات البرمجية الحديثة بدلاً من الأسلوب القديم لتفادي التجمد
        cells.forEach(cell => {
            cell.addEventListener('click', function() {
                const num = parseInt(this.getAttribute('data-num'));
                if (!playActive || boardState[num] !== "") return;
                executeMove(num, "X");
            });
        });

        resetBtn.addEventListener('click', restartMatch);
        difficultySelect.addEventListener('change', restartMatch);

        function executeMove(num, sign) {
            boardState[num] = sign;
            cells[num].innerText = sign;
            cells[num].classList.add(sign.toLowerCase());

            if (checkWinner(sign)) {
                if (sign === "X") statusText.innerText = "مبروك! لقد فزت على الكمبيوتر! 🎉";
                else statusText.innerText = "خسرت! الكمبيوتر فاز هذه المرة. 💥";
                playActive = false;
                return;
            }

            if (!boardState.includes("")) {
                statusText.innerText = "تعادل! 🤝";
                playActive = false;
                return;
            }

            if (sign === "X") {
                playActive = false;
                statusText.innerText = "جاري تفكير الكمبيوتر...";
                setTimeout(botPlay, 300);
            } else {
                playActive = true;
                statusText.innerText = "دورك الآن (X)";
            }
        }

        function checkWinner(s) {
            const b = boardState;
            if (b[0]===s && b[1]===s && b[2]===s) return true;
            if (b[3]===s && b[4]===s && b[5]===s) return true;
            if (b[6]===s && b[7]===s && b[8]===s) return true;
            if (b[0]===s && b[3]===s && b[6]===s) return true;
            if (b[1]===s && b[4]===s && b[7]===s) return true;
            if (b[2]===s && b[5]===s && b[8]===s) return true;
            if (b[0]===s && b[4]===s && b[8]===s) return true;
            if (b[2]===s && b[4]===s && b[6]===s) return true;
            return false;
        }

        function botPlay() {
            const level = difficultySelect.value;
            let choice = -1;

            if (level === "medium" || level === "hard") {
                choice = findSmartIndex("O");
                if (choice === -1) choice = findSmartIndex("X");
            }

            if (level === "hard" && choice === -1) {
                if (boardState[4] === "") choice = 4;
            }

            if (choice === -1) {
                let emptyCells = [];
                boardState.forEach((val, idx) => { if (val === "") emptyCells.push(idx); });
                if (emptyCells.length > 0) {
                    choice = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                }
            }

            if (choice !== -1) {
                executeMove(choice, "O");
            }
        }

        function findSmartIndex(s) {
            const b = boardState;
            if (b[0]===s && b[1]===s && b[2]==="") return 2;
            if (b[0]===s && b[2]===s && b[1]==="") return 1;
            if (b[1]===s && b[2]===s && b[0]==="") return 0;
            if (b[3]===s && b[4]===s && b[5]==="") return 5;
            if (b[3]===s && b[5]===s && b[4]==="") return 4;
            if (b[4]===s && b[5]===s && b[3]==="") return 3;
            if (b[6]===s && b[7]===s && b[8]==="") return 8;
            if (b[6]===s && b[8]===s && b[7]==="") return 7;
            if (b[7]===s && b[8]===s && b[6]==="") return 6;
            if (b[0]===s && b[3]===s && b[6]==="") return 6;
            if (b[0]===s && b[6]===s && b[3]==="") return 3;
            if (b[3]===s && b[6]===s && b[0]==="") return 0;
            if (b[1]===s && b[4]===s && b[7]==="") return 7;
            if (b[1]===s && b[7]===s && b[4]==="") return 4;
            if (b[4]===s && b[7]===s && b[1]==="") return 1;
            if (b[2]===s && b[5]===s && b[8]==="") return 8;
            if (b[2]===s && b[8]===s && b[5]==="") return 5;
            if (b[5]===s && b[8]===s && b[2]==="") return 2;
            if (b[0]===s && b[4]===s && b[8]==="") return 8;
            if (b[0]===s && b[8]===s && b[4]==="") return 4;
            if (b[4]===s && b[8]===s && b[0]==="") return 0;
            if (b[2]===s && b[4]===s && b[6]==="") return 6;
            if (b[2]===s && b[6]===s && b[4]==="") return 4;
            if (b[4]===s && b[6]===s && b[2]==="") return 2;
            return -1;
        }

        function restartMatch() {
            boardState = ["", "", "", "", "", "", "", "", ""];
            playActive = true;
            statusText.innerText = "دورك الآن (X)";
            cells.forEach(cell => {
                cell.innerText = "";
                cell.className = "cell";
            });
        }
    </script>
</body>
</html>
